<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Dashboard | G.T Water</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <img src="../assets/logo/logo.png"
                    alt="Logo"
                    class="sidebar-logo">

                <h2>G.T Water</h2>

            </div>

            <nav>

                <ul>

                    <li class="active">
                        Dashboard
                    </li>

                    <li onclick="window.location='orders.html'">
                        Orders
                    </li>

                    <li onclick="window.location='customers.html'">
                        Customers
                    </li>

                    <li onclick="window.location='reports.html'">
                        Reports
                    </li>

                    <li onclick="window.location='settings.html'">
                        Settings
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Main -->

        <main class="main-content">

            <!-- Header -->

            <header class="topbar">

                <h1>Dashboard</h1>

                <div class="profile" onclick="window.location='settings.html'" style="cursor:pointer;">

                    <img
                        src="../assets/images/profile.png"
                        alt="Owner">

                    <span>Administrator</span>

                </div>

            </header>

            <!-- Cards -->

            <!-- Cards -->
            <section class="cards">
                <div class="card" onclick="window.location.href='orders.html'" style="cursor: pointer;">
                    <h3>Today's Orders</h3>
                    <h2 id="todayOrders">
                        0
                    </h2>
                </div>

                <div class="card" onclick="window.location.href='orders.html'" style="cursor: pointer;">
                    <h3>Pending</h3>
                    <h2 id="pendingOrders">
                        0
                    </h2>
                </div>

                <div class="card" onclick="window.location.href='orders.html'" style="cursor: pointer;">
                    <h3>Delivered</h3>
                    <h2 id="completedOrders">
                        0
                    </h2>
                </div>

                <div class="card" onclick="window.location.href='customers.html'" style="cursor: pointer;">
                    <h3>Customers</h3>
                    <h2 id="customers">
                        0
                    </h2>
                </div>
            </section>

            <!-- Recent Orders -->
            <section class="recent-orders card">
                <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>
                        Recent Orders
                    </h2>
                    <button type="button" onclick="window.location.href='orders.html'" style="background: none; border: none; color: var(--primary); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                        View All →
                    </button>
                </div>

                <!-- Desktop Table View (>= 769px) -->
                <div class="table-responsive desktop-view-only">
                    <table>
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Product</th>
                                <th>Phone</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentOrdersBody">
                            <tr>
                                <td colspan="4" style="text-align:center; color:#64748b;">Loading recent orders...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Mobile Cards View (<= 768px) -->
                <div class="mobile-view-only" id="recentOrdersCards"></div>
            </section>

            <!-- Quick Actions -->
            <section class="quick-actions">
                <button type="button" id="registerBtn" onclick="window.location.href='register-customer.html'">
                    + Register Customer
                </button>
                <button type="button" id="ordersBtn" onclick="window.location.href='orders.html'">
                    📦 Orders
                </button>
                <button type="button" id="reportsBtn" onclick="window.location.href='reports.html'">
                    📊 Reports
                </button>
            </section>

        </main>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/mobile-nav.js"></script>
    <script src="../js/dashboard.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js")
                    .catch((error) => console.error("Service Worker registration failed:", error));
            });
        }
    </script></body>

</html>
