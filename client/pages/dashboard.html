<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Dashboard | G.T Water</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <img src="../assets/logo/logo.png"
                    alt="Logo"
                    class="sidebar-logo">

                <h2>G.T Water</h2>

            </div>

            <nav>

                <ul>

                    <li class="active">
                        Dashboard
                    </li>

                    <li onclick="window.location='orders.html'">
                        Orders
                    </li>

                    <li onclick="window.location='customers.html'">
                        Customers
                    </li>

                    <li onclick="window.location='reports.html'">
                        Reports
                    </li>

                    <li onclick="window.location='settings.html'">
                        Settings
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Main -->

        <main class="main-content">

            <!-- Header -->

            <header class="topbar">

                <h1>Dashboard</h1>

                <div class="profile" onclick="window.location='settings.html'" style="cursor:pointer;">

                    <img
                        src="../assets/images/profile.png"
                        alt="Owner">

                    <span>Administrator</span>

                </div>

            </header>

            <!-- Cards -->

            <section class="cards">

                <div class="card">

                    <h3>Today's Orders</h3>

                    <h2 id="todayOrders">
                        0
                    </h2>

                </div>

                <div class="card">

                    <h3>Pending</h3>

                    <h2 id="pendingOrders">
                        0
                    </h2>

                </div>

                <div class="card">

                    <h3>Delivered</h3>

                    <h2 id="completedOrders">
                        0
                    </h2>

                </div>

                <div class="card">

                    <h3>Customers</h3>

                    <h2 id="customers">
                        0
                    </h2>

                </div>

            </section>

            <!-- Recent Orders -->

            <section class="recent-orders card">

                <div class="section-title">

                    <h2>
                        Recent Orders
                    </h2>

                </div>

                <div class="table-responsive">
                    <table>

                        <thead>

                            <tr>

                                <th>Customer</th>

                                <th>Product</th>

                                <th>Qty</th>

                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody id="recentOrdersBody">

                            <tr>
                                <td colspan="4" style="text-align:center; color:#64748b;">Loading recent orders...</td>
                            </tr>

                        </tbody>

                    </table>
                </div>

            </section>

            <!-- Quick Actions -->

            <section class="quick-actions">

                <button id="registerBtn">

                    Register Customer

                </button>

                <button id="ordersBtn">

                    Orders

                </button>

                <button id="reportsBtn">

                    Reports

                </button>

            </section>

        </main>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/mobile-nav.js"></script>
    <script src="../js/dashboard.js"></script>

</body>

</html>
