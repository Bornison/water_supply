<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | BashiKhong Water Supply</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <img src="../assets/logo/logo.png"
                    alt="Logo"
                    class="sidebar-logo">

                <h2>BashiKhong</h2>

            </div>

            <nav>

                <ul>

                    <li class="active">
                        Dashboard
                    </li>

                    <li onclick="window.location='orders.html'">
                        Orders
                    </li>

                    <li onclick="window.location='customers.html'">
                        Customers
                    </li>

                    <li onclick="window.location='reports.html'">
                        Reports
                    </li>

                    <li onclick="window.location='settings.html'">
                        Settings
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Main -->

        <main class="main-content">

            <!-- Header -->

            <header class="topbar">

                <h1>Dashboard</h1>

                <div class="profile">

                    <img
                        src="../assets/images/profile.png"
                        alt="Owner">

                    <span>Administrator</span>

                </div>

            </header>

            <!-- Cards -->

            <section class="cards">

                <div class="card">

                    <h3>Today's Orders</h3>

                    <h2 id="todayOrders">
                        12
                    </h2>

                </div>

                <div class="card">

                    <h3>Pending</h3>

                    <h2 id="pendingOrders">
                        5
                    </h2>

                </div>

                <div class="card">

                    <h3>Delivered</h3>

                    <h2 id="completedOrders">
                        7
                    </h2>

                </div>

                <div class="card">

                    <h3>Customers</h3>

                    <h2 id="customers">
                        104
                    </h2>

                </div>

            </section>

            <!-- Recent Orders -->

            <section class="recent-orders card">

                <div class="section-title">

                    <h2>
                        Recent Orders
                    </h2>

                </div>

                <table>

                    <thead>

                        <tr>

                            <th>Customer</th>

                            <th>Product</th>

                            <th>Qty</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="recentOrdersBody">

                        <tr>

                            <td>Rahul</td>

                            <td>20L Jar</td>

                            <td>2</td>

                            <td>
                                Pending
                            </td>

                        </tr>

                        <tr>

                            <td>David</td>

                            <td>20L Jar</td>

                            <td>1</td>

                            <td>
                                Delivered
                            </td>

                        </tr>

                    </tbody>

                </table>

            </section>

            <!-- Quick Actions -->

            <section class="quick-actions">

                <button id="registerBtn">

                    Register Customer

                </button>

                <button id="ordersBtn">

                    Orders

                </button>

                <button id="reportsBtn">

                    Reports

                </button>

            </section>

        </main>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>

</body>

</html>
