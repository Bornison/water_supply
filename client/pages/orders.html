<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Orders | BashiKhong Water</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/orders.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <img
                    src="../assets/logo/logo.png"
                    alt="Logo"
                    class="sidebar-logo">

                <h2>BashiKhong</h2>

            </div>

            <nav>

                <ul>

                    <li onclick="window.location='dashboard.html'">
                        Dashboard
                    </li>

                    <li class="active" onclick="window.location='orders.html'">
                        Orders
                    </li>

                    <li onclick="window.location='customers.html'">
                        Customers
                    </li>

                    <li onclick="window.location='reports.html'">
                        Reports
                    </li>

                    <li onclick="window.location='settings.html'">
                        Settings
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <!-- Header -->

            <header class="topbar">

                <h1>Orders</h1>

                <div class="profile">

                    <img
                        src="../assets/images/profile.png"
                        alt="Profile">

                    <span>Administrator</span>

                </div>

            </header>

            <section class="search-box">

                <div class="search-row">

                    <input
                        type="text"
                        id="searchOrder"
                        placeholder="Search orders...">

                    <div class="page-actions">

                        <div class="status-filters">

                            <button class="status-btn active" data-status="all">All</button>
                            <button class="status-btn" data-status="pending">Pending</button>
                            <button class="status-btn" data-status="delivered">Delivered</button>
                            <button class="status-btn" data-status="cancelled">Cancelled</button>

                        </div>

                        <button class="refresh-btn" id="refreshBtn">Refresh</button>

                    </div>

                </div>

            </section>

            <section class="orders-table card">

                <div class="table-header">

                    <h2>Order List</h2>

                </div>

                <p class="orders-message" id="ordersMessage">Loading orders...</p>

                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>Order No</th>
                                <th>Customer Code</th>
                                <th>Customer Name</th>
                                <th>Phone</th>
                                <th>Products</th>
                                <th>Quantity</th>
                                <th>Status</th>
                                <th>Ordered Date</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="ordersTableBody"></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/orders.js"></script>

</body>

</html>
