<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Orders | G.T Water</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/orders.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <img
                    src="../assets/logo/logo.png"
                    alt="Logo"
                    class="sidebar-logo">

                <h2>G.T Water</h2>

            </div>

            <nav>

                <ul>

                    <li onclick="window.location='dashboard.html'">
                        Dashboard
                    </li>

                    <li class="active" onclick="window.location='orders.html'">
                        Orders
                    </li>

                    <li onclick="window.location='customers.html'">
                        Customers
                    </li>

                    <li onclick="window.location='reports.html'">
                        Reports
                    </li>

                    <li onclick="window.location='settings.html'">
                        Settings
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <!-- Header -->

            <header class="topbar">

                <h1>Orders</h1>

                <div class="profile">

                    <img
                        src="../assets/images/profile.png"
                        alt="Profile">

                    <span>Administrator</span>

                </div>

            </header>

            <section class="search-box">

                <div class="search-row">

                    <input
                        type="text"
                        id="searchOrder"
                        placeholder="Search customer, phone, order no...">

                    <div class="page-actions">

                        <div class="status-filters">

                            <button class="status-btn active" data-status="all">All</button>
                            <button class="status-btn" data-status="pending">Pending</button>
                            <button class="status-btn" data-status="due">Due List</button>
                            <button class="status-btn" data-status="delivered">Delivered</button>
                            <button class="status-btn" data-status="cancelled">Cancelled</button>

                        </div>

                        <button class="refresh-btn" id="refreshBtn">Refresh</button>

                    </div>

                </div>

            </section>

            <section class="orders-table card">

                <div class="table-header">

                    <h2 id="ordersTableTitle">Order List</h2>

                </div>

                <p class="orders-message" id="ordersMessage">Loading orders...</p>

                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>Order No</th>
                                <th>Customer Name</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Products</th>
                                <th>Quantity</th>
                                <th>Status</th>
                                <th>Ordered Date</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="ordersTableBody"></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/mobile-nav.js"></script>
    <script src="../js/orders.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js")
                    .catch((error) => console.error("Service Worker registration failed:", error));
            });
        }
    </script></body>

</html>
