<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Reports | G.T Water</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/reports.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <img
                src="../assets/logo/logo.png"
                alt="Logo"
                class="sidebar-logo">

            <h2>G.T Water</h2>

        </div>

        <nav>

            <ul>

                <li onclick="window.location='dashboard.html'">
                    Dashboard
                </li>

                <li onclick="window.location='orders.html'">
                    Orders
                </li>

                <li onclick="window.location='customers.html'">
                    Customers
                </li>

                <li class="active">
                    Reports
                </li>

                <li onclick="window.location='settings.html'">
                    Settings
                </li>

            </ul>

        </nav>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <header class="topbar">

            <div class="topbar-title-wrap">
                <h1>Reports</h1>
                <p class="topbar-subtitle">Overview & business performance metrics</p>
            </div>

            <div class="topbar-actions">
                <button class="btn-history" onclick="window.location.href='history.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>View Order History</span>
                </button>

                <div class="profile">

                    <img
                        src="../assets/images/profile.png"
                        alt="Profile">

                    <span>Administrator</span>

                </div>
            </div>

        </header>

        <!-- Report Cards -->

        <section class="report-summary">

            <div class="report-card">

                <h3>Today's Orders</h3>

                <h2 id="todayOrders">
                    12
                </h2>

            </div>

            <div class="report-card">

                <h3>This Week</h3>

                <h2 id="weekOrders">
                    78
                </h2>

            </div>

            <div class="report-card">

                <h3>This Month</h3>

                <h2 id="monthOrders">
                    312
                </h2>

            </div>

            <div class="report-card">

                <h3>This Year</h3>

                <h2 id="yearOrders">
                    3,281
                </h2>

            </div>

        </section>

        <!-- Report Table -->

        <section class="report-table card">

            <h2>Recent Report</h2>

            <div class="table-responsive">
                <table>

                    <thead>

                        <tr>

                            <th>Date</th>

                            <th>Total Orders</th>

                            <th>Delivered</th>

                            <th>Cancelled</th>

                        </tr>

                    </thead>

                    <tbody id="reportTableBody">

                        <tr>
                            <td colspan="4" style="text-align:center; color:#64748b;">Loading reports...</td>
                        </tr>

                    </tbody>

                </table>
            </div>

        </section>

    </main>

</div>

<script src="../js/auth.js"></script>
<script src="../js/mobile-nav.js"></script>
<script src="../js/reports.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js")
                    .catch((error) => console.error("Service Worker registration failed:", error));
            });
        }
    </script></body>

</html>
